{
  "pipe_parallel_size": 1,
  "model_parallel_size": 1,
  "make_vocab_size_divisible_by": 8,

  "num_layers": 34,
  "hidden_size": 2816,
  "num_attention_heads": 22, # hidden_size / num_attention_heads gives you size of each head, useful for MQA 
  "num_heads": 2816, # keep this always hidden_size
    "operator-config": [ [["hyena_short_conv"], 1], [["hyena"], 3], [["hyena_short_conv"], 1], [["hyena"], 3], [["hyena_short_conv"], 1], [["hyena"], 2], # 11
    [["flash_v2"], 1],
     [["hyena_short_conv"], 1], [["hyena"], 3], [["hyena_short_conv"], 1], [["hyena"], 2], [["hyena_short_conv"], 1], [["hyena"], 2],  # 10
     [["flash_v2"], 1], 
     [["hyena_short_conv"], 1], [["hyena"], 3], [["hyena_short_conv"], 1], [["hyena"], 2], [["hyena_short_conv"], 1], [["hyena"], 2],  # 10
      [["flash_v2"], 1] ],
  "seq_length": 8192,
  "max_position_embeddings": 8192,

  "pos_emb": "rotary",
  "rotary_pct": 1,
  "prenorm": true,
  "postnorm": false,
  "pre_mlp_norm": true,  
  "outer_mlp_norm": false,
  "no_weight_tying": false,
  "gpt_j_residual": false,
  "normalize_hyena_filters": false,
  "short-conv-L": 3, 
  "hyena_filter_fast_decay": 0.3,
  "hyena_filter_slow_decay": 1.2,
  "hyena_filter_w": 14, 
  "hyena_filter_cls": "implicit_real_modal",
  "hyena_filter_order": 16,
  "hyena_filter_wd": 0.,
  "use_fast_heads": false,
  "use_slow_heads": false,
  "use-hyena-filter": true,
  "output_layer_parallelism": "column",
  "bias_dropout_fusion": false,
  "norm": "rmsnorm",
  "rms_norm_epsilon": 1.0e-6,
  "identity_mlp": false,
   "mlp_type": "llama",
   "scaled-upper-triang-masked-softmax-fusion": true,
   "bias-gelu-fusion": false,
   "init_method": "small_init",
   "output_layer_init_method": "wang_init",
   "optimizer": {
     "type": "Adam",
     "params": {
       "lr": 0.000455,
       "betas": [0.9, 0.95],
       "eps": 1.0e-8,
     }
   },
   "min_lr": 0.0000455,
   "zero_optimization": {
    "stage": 0,
    "allgather_partitions": True,
    "allgather_bucket_size": 500000000,
    "overlap_comm": True,
    "reduce_scatter": True,
    "reduce_bucket_size": 500000000,
    "contiguous_gradients": True,
    "cpu_offload": false
  },
   "train_micro_batch_size_per_gpu": 4,  # x 4 nodes
   "gradient_accumulation_steps": 1,
   "data-impl": "mmap",
   "checkpoint-activations": true,
   "checkpoint-num-layers": 1,
   "partition-activations": true,
   "synchronize-each-layer": true,
   "gradient_clipping": 1.0,
   "weight-decay": 0.1,
   "hidden-dropout": 0.0,
   "attention-dropout": 0.0,
   "precision": "bfloat16",
   "bf16": {
   "enabled": true
    },
   "train-iters": 40000,
   "lr-decay-iters": 40000,
   "distributed-backend": "nccl",
   "lr-decay-style": "cosine",
   "warmup": 0.01,
   "checkpoint-factor": 6000,
   "eval-interval": 100,
   "eval-iters": 20,
   "log-interval": 100,
   "steps_per_print": 100,
   "keep-last-n-checkpoints": 1,
   "wall_clock_breakdown": false,
   "save": "/checkpoint/hielab/etnguyen/checkpoints/large_models/hyena_3b_8k_len_22h_9sc_3a_custom_proj_524k_40k", # change this
   "tokenizer_type": CharLevelTokenizer,   
  #  "iteration": 200,
  #  "use_checkpoint_lr_scheduler": True,
   "use_fp8_linears": true,
   "master_port": 29502,
  #  "include": "localhost@localhost:0",
  #  "num_gpus": 1,
  #  "bidirectional": True,
   "materialize_attn_mask": false,  # default false, to save memory
  #  "tie_projection_weights": true,
  # "seed": 2222,
    "hyena_short_conv_len": 7,
    # "fast_conv_mixer": true,
    "fast_conv_proj": true,

  # multinode
  "launcher": "pdsh",
  "hostfile": "./hostfile_eric",
  "deepspeed_slurm": false,

}

