{
  "pipe_parallel_size": 2,
  "model_parallel_size": 1,
  "make_vocab_size_divisible_by": 8,

  "num_layers": 32,
  "hidden_size": 4096,
  "num_attention_heads": 32,
  "num_heads": 4096,
  "operator-config": [[["hyena"], 8], [["flash_v2"], 1], [["hyena"], 7], [["flash_v2"], 1], [["hyena"], 7], [["flash_v2"], 1], [["hyena"], 7]],
   "seq_length": 256,
  "max_position_embeddings": 256,

  "hyena_filter_cls": "implicit_real_modal",
  "pos_emb": "rotary",
  "rotary_pct": 1,
  "prenorm": true,
  "postnorm": false,
  "pre_mlp_norm": true,  
  "outer_mlp_norm": false,
  "no_weight_tying": false,
  "gpt_j_residual": false,
  "normalize_hyena_filters": false,
  "short-conv-L": 3, 
  "hyena_filter_fast_decay": 0.3,
  "hyena_filter_slow_decay": 1.2,
  "hyena_filter_w": 10, 
  "hyena_filter_order": 16,
  "hyena_filter_wd": 0.,
  # "proj_groups": 8,
  "norm": "rmsnorm",
  # "grouped_attention": true, 
  "use_fast_heads": false,
  "use_slow_heads": false,
  "use-hyena-filter": true,
  "output_layer_parallelism": "column",
  "bias_dropout_fusion": false,
  "rms_norm_epsilon": 1.0e-6,
  "identity_mlp": false,
  "mlp_type": "llama",
   "scaled-upper-triang-masked-softmax-fusion": true,
   "bias-gelu-fusion": false,
   "init_method": "small_init",
   "output_layer_init_method": "wang_init",
   "optimizer": {
     "type": "Adam",
     "params": {
       "lr": 0.00009698, # TODO: Use learning rate from starting checkpoint.
       "betas": [0.9, 0.95],
       "eps": 1.0e-8,
     }
   },
    "deepspeed_extra_args": {
      "data_types": 
        { "grad_accum_dtype": "fp32"},
        "load_universal_checkpoint": False,
    },
   "min_lr": 0.000009698,
   "zero_optimization": {
    "stage": 0,
    "allgather_partitions": True,
    "allgather_bucket_size": 500000000,
    "overlap_comm": True,
    "reduce_scatter": True,
    "reduce_bucket_size": 500000000,
    "contiguous_gradients": True,
    "cpu_offload": false
  },

   # number of samples per iteration = micro batch per gpu * gpus * grad_accum / pipeline parallel
   # number of tokens iteration = seq length * number of samples per iteration
   "train_micro_batch_size_per_gpu": 32,
   "gradient_accumulation_steps": 1,

   "data-impl": "mmap",
   "checkpoint-activations": true,
   "checkpoint-num-layers": 1,
   "partition-activations": true,
   "synchronize-each-layer": true,
   "gradient_clipping": 1.0,
   "weight-decay": 0.2,
   "hidden-dropout": 0.0,
   "attention-dropout": 0.0,
   "precision": "bfloat16",
   "bf16": {
   "enabled": true
    }, 
   "train-iters": 500,
   "lr-decay-iters": 500,
   "distributed-backend": "nccl",
   "lr-decay-style": "cosine",
   "warmup": 0.1,
   "checkpoint-factor": 100,
  #  "extra_save_iters": [256,512],
   "eval-interval": 20,
   "eval-iters": 20,
   "log-interval": 20,
   "steps_per_print": 20,
   "keep-last-n-checkpoints": 5,
   "wall_clock_breakdown": false,
   "tokenizer_type": CharLevelTokenizer,

   "save": "/checkpoint/hielab/etnguyen/rfam/7b_striped_finetune_rfam_v2",
 
  #  # multinode
  #  "launcher": "pdsh",
  #  "hostfile": "./hostfile",
  #  "deepspeed_slurm": false,
 
  #  # loading
  #  "iteration": ,
   "load": "/checkpoint/hielab/etnguyen/7b_striped_120k",
   "use_checkpoint_lr_scheduler": False,
   "override_lr_scheduler": True,
   "iteration": 75_000,

   # finetuning-specific params
   "finetune": True,
   "pad_mask_loss": True,
   "enforce_sample_length": True,
}
