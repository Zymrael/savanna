{
  "pipe_parallel_size": 0,
  "model_parallel_size": 1,
  "make_vocab_size_divisible_by": 8,
  "num_layers": 12,
  "hidden_size": 768,
  "num_attention_heads": 12,
    "operator-config": [ 
      [["flash_v2"], 12]
    ],
  "seq_length": 8192,
  "max_position_embeddings": 8192,
  "log_attn_norms": false,
  "pos_emb": "rotary",
  "rotary_pct": 1,
  "prenorm": true,
  "postnorm": false,
  "pre_mlp_norm": true,  
  "outer_mlp_norm": false,
  "no_weight_tying": false,
  "output_layer_parallelism": "column",
  "bias_dropout_fusion": false,
  "norm": "rmsnorm",
  "rms_norm_epsilon": 1.0e-6,
  "identity_mlp": false,
   "bias-gelu-fusion": false,
   "init_method": "small_init",
   "output_layer_init_method": "wang_init",
   "optimizer": {
     "type": "Adam",
     "params": {
       "lr": 0.0006,
       "betas": [0.9, 0.95],
       "eps": 1.0e-8,
     }
   },
   "min_lr": 0.00006,
   "zero_optimization": {
    "stage": 1,
    "allgather_partitions": True,
    "allgather_bucket_size": 500000000,
    "overlap_comm": True,
    "reduce_scatter": True,
    "reduce_bucket_size": 500000000,
    "contiguous_gradients": True,
    "cpu_offload": false
  },
   "train_micro_batch_size_per_gpu": 16,
   "gradient_accumulation_steps": 1,
   "data-impl": "mmap",
   "checkpoint-activations": true,
   "checkpoint-num-layers": 4,
   "partition-activations": true,
   "synchronize-each-layer": false,
   "gradient_clipping": 1.0,
   "weight-decay": 0.1,
   "hidden-dropout": 0.0,
   "attention-dropout": 0.0,
   "precision": "bfloat16",
   "bf16": {
   "enabled": true
    },
   "short-conv-L": 3, 
   "train-iters": 20000,
   "lr-decay-iters": 20000,
   "distributed-backend": "nccl",
   "lr-decay-style": "cosine",
   "warmup": 0.01,
   "checkpoint-factor": 10000,
   "eval-interval": 100,
   "eval-iters": 20,
   "log-interval": 5,
   "steps_per_print": 5,
   "keep-last-n-checkpoints": 1,
   "wall_clock_breakdown": false,
   "save": "/checkpoint/hielab/mpoli/checkpoints/125m_llama_utf8", # change this
   "tokenizer_type": CharLevelTokenizer,   
   "mlp_type": "llama",
   "use_fp8_linears": true,
   "use_fp8_hyena_mlp_input_projections": true,
   "use_fp8_hyena_mlp_output_projections": true,
   "use_fp8_input_projections": true,
   "use_fp8_output_projections": true,
   "master_port": 29502,
   "materialize_attn_mask": false,  # default false, to save memory
  "fast_conv_proj": true,   
  "hyena_se_len": 7,
  "to_upper": "weighted",
  "lowercase_loss_reweighting": 0.1,  
}

